# The credentials of a remote consumer's local entrypoints (see "Remote consumers" in AGENTS.md). Its base package
# declares api, the OTA entry with id ota_esphome, and wifi with id wifi_id and an ap block, all without secrets; this
# package adds the keys from the consumer's secrets.yaml. A dashboard configuration that takes the consumer's packages
# remotely supplies its own credentials instead and does not include this file.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - id: !extend ota_esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret wifi_hotspot_password
